server {
    listen 80;

    # /api/notes/... goes to the Node.js service (path kept as is)
    location /api/notes {
        proxy_pass http://notes:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # /api/tasks/... goes to FastAPI, with /api removed
    # /api/tasks -> /tasks
    location /api/tasks {
        proxy_pass http://tasks:8000/tasks;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else goes to the React site
    location / {
        proxy_pass http://web:80;
    }
}